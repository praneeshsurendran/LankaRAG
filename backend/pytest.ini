# pytest configuration for LankaRAG backend test suite
[pytest]
# Enable asyncio mode automatically for all async tests
asyncio_mode = auto

# Test discovery roots
testpaths = tests

# Show short summary of all failures
addopts = -v --tb=short --strict-markers

# Register custom markers
markers =
    asyncio: mark test as async (auto-detected with asyncio_mode=auto)
    integration: slow tests that hit real external services
    unit: fast isolated unit tests
