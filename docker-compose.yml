version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: lankarag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lankarag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lankarag_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lankarag_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount init SQL scripts
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lankarag} -d ${POSTGRES_DB:-lankarag_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lankarag_net

volumes:
  postgres_data:
    driver: local

networks:
  lankarag_net:
    driver: bridge
